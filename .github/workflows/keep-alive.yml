name: Keep site awake

# Pings the Render app so the free instance does not go to sleep.
# GitHub runs scheduled jobs on a best-effort basis, so timings can drift.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://shem-messo-chess-site.onrender.com/api/health || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Site did not answer with 200 after 3 attempts"
          exit 1
